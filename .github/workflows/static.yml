name: Validate and deploy static site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-collector.lock
      - run: python -m pytest
      - run: ruff check collector tests/unit/test_collector*.py tests/data/test_p0_review.py tests/security tests/integration
      - run: ruff format --check collector tests/unit/test_collector*.py tests/data/test_p0_review.py tests/security tests/integration
      - run: mypy collector --ignore-missing-imports
      - run: python build.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  collector-postgis:
    runs-on: ubuntu-latest
    services:
      staging-db:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: collector_test
          POSTGRES_USER: collector_test
          POSTGRES_PASSWORD: disposable_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector_test -d collector_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-collector.lock
      - run: python -m pytest tests/integration/test_collector_storage.py
        env:
          COLLECTOR_TEST_DATABASE_URL: postgresql+psycopg://collector_test:disposable_ci_only@127.0.0.1:5432/collector_test

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [validate, collector-postgis]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
