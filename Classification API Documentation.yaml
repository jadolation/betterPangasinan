openapi: 3.0.3
info:
  title: Classification API Documentation
  version: 1.0.0
  description: The Classification API Documentation serves as the official reference
    for the Statistical Classification System API. It provides detailed information
    on all available endpoints, including their parameters, request and response schemas,
    and sample responses for each classification system. Users with a valid API access
    token may also execute live API requests through the integrated "Try it out" feature
    to validate responses and support application development.
paths:
