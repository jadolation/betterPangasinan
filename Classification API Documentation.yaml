components:
  schemas:
    BroadField:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        level:
          type: string
          maxLength: 100
        broadfield:
          type: string
          maxLength: 100
        broadfield_title:
          type: string
          maxLength: 255
        broadfielddesc:
          type: string
          maxLength: 255
        version:
          type: string
          maxLength: 255
      required:
      - broadfield
      - broadfield_title
      - broadfielddesc
      - id
      - level
      - version
